name: Cross-platform PoC checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile and exercise portable CLI
        shell: bash
        run: |
          python -m py_compile patch_ropro.py
          python -m py_compile build_release.py
          python -m py_compile tools/update_audits.py
          python patch_ropro.py --help
          python -m unittest discover -s tests -v
          python build_release.py --output-dir dist
